name: ci

on:
  push:
    branches: [main, v2-rebuild]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q
      - name: Deterministic evals (safety guardrails, model metrics)
        run: liverbuddy eval safety ml
      - name: Fail if held-out escalation recall regresses
        run: |
          python - <<'EOF'
          import json, sys
          s = json.load(open("evals/results/latest.json"))["suites"]["safety"]
          print("held-out accuracy", s["heldout_accuracy"], "escalation recall", s["heldout_escalation_recall"])
          sys.exit(0 if s["heldout_escalation_recall"] >= 100 and s["escalation_recall"] >= 100 else 1)
          EOF

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t liverbuddy:ci .
      - name: Smoke test
        run: |
          trap 'docker logs lb | tail -40' EXIT
          docker run -d --name lb -p 8000:8000 -e LB_LLM_PROVIDER=fake liverbuddy:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health | python3 -c "import json,sys; r=json.load(sys.stdin)['resources']; assert r['risk_models'], r"
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          curl -sf -X POST localhost:8000/api/risk -H 'content-type: application/json'             -d '{"measures":{"age":50,"sex":"male","height_cm":170,"weight_kg":90,"alt":60,"ast":40},"task":"steatosis"}' | grep -q probability
          curl -sf -X POST localhost:8000/api/scores -H 'content-type: application/json' \
            -d '{"age":50,"ast":40,"alt":36,"platelets":200}' | grep -q '"FIB-4"'
