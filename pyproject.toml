[project]
name = "liverbuddy"
version = "2.0.0"
description = "Grounded, evaluated clinical-AI copilot for MASLD (metabolic dysfunction-associated steatotic liver disease)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "xgboost>=2.1",
    "joblib>=1.4",
    "rapidfuzz>=3.9",
    "pypdf>=4.3",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.3", "ruff>=0.6", "matplotlib>=3.9"]

[project.scripts]
liverbuddy = "liverbuddy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liverbuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running LLM provider and built indexes"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
