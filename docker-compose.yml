# Full local stack: Ollama + Liver Buddy (API under /api, web UI at /).
#   docker compose --profile setup run --rm setup   # once: download data, pull models, build indexes
#   docker compose up -d                            # then open http://localhost:8000
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    # Uncomment for NVIDIA GPUs (needs the NVIDIA container toolkit):
    # deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}

  setup:
    build: .
    profiles: [setup]
    depends_on: [ollama]
    env_file: [{path: .env, required: false}]
    environment:
      LB_OLLAMA_URL: http://ollama:11434
    volumes: [data:/app/data, index:/app/artifacts/index]
    command: ["sh", "-c", "liverbuddy pull-models && liverbuddy download && liverbuddy build-index"]

  api:
    build: .
    depends_on: [ollama]
    env_file: [{path: .env, required: false}]
    environment:
      LB_OLLAMA_URL: http://ollama:11434
      LB_DATABASE_URL: sqlite:////app/artifacts/db/liverbuddy.db
    volumes: [data:/app/data, index:/app/artifacts/index, db:/app/artifacts/db]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      retries: 5

volumes:
  ollama: {}
  data: {}
  index: {}
  db: {}
